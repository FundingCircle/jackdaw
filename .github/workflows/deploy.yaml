run-name: Jackdaw build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '*publish-snapshot*'

jobs:
  run_checks:
    uses: ./.github/workflows/run_checks.yaml
  deploy:
    needs: run_checks
    runs-on: ubuntu-latest
    container:
      image: clojure:temurin-21-tools-deps
    environment: clojars_deploy
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history and tags so build.clj/derive-version can find the
          # latest semver tag (snapshot builds are triggered by non-semver tags).
          fetch-depth: 0
      - name: deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Deliberately a literal, not a secret: a fingerprint is not
          # sensitive, and masking it would redact the `gpg
          # --list-secret-keys` output below, which is what diagnosed the
          # expired-key failure in the first place.
          GPG_KEY_ID: DB8FD4761D2C2B55C50397727658FBE150227262
        run: |
          # https://github.com/actions/runner/issues/2033
          git config --global --add safe.directory /__w/jackdaw/jackdaw
          apt-get update
          apt-get install -y gpg
          # Pin GNUPGHOME so the import below and the gpg subprocess that
          # deps-deploy execs at signing time resolve the same keyring. GPG 2.1+
          # keeps secret keys under $GNUPGHOME/private-keys-v1.d; if HOME drifts
          # between processes the importer writes a keyring the signer can't see.
          export GNUPGHOME="$HOME/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # Quote the secret: harmless for single-line base64, but preserves
          # newlines if the key is exported as multi-line ASCII armor.
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --yes --batch --import
          gpg --list-secret-keys --keyid-format=long
          # Fail fast if the imported key can't actually sign, rather than after
          # deps-deploy has spent ~16s building the jar first.
          echo "jackdaw gpg signing smoke test" > gpg-smoke.txt
          echo "$GPG_PASSPHRASE" | gpg --pinentry-mode loopback --batch --yes \
            --passphrase-fd 0 --local-user "$GPG_KEY_ID" \
            --armor --detach-sign gpg-smoke.txt
          rm -f gpg-smoke.txt gpg-smoke.txt.asc
          # Route deps-deploy's `gpg` calls through the loopback wrapper so the
          # passphrase can be supplied non-interactively.
          export REAL_GPG=$(command -v gpg)
          export PATH="/__w/jackdaw/jackdaw/bin:$PATH"
          # Confirm the wrapper on PATH still sees the secret key immediately
          # before deploy, matching exactly what deps-deploy will invoke.
          gpg --list-secret-keys --keyid-format=long
          clojure -T:build deploy

