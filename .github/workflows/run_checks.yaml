run-name: Run checks

on:
  workflow_call:

jobs:
  RunChecks:
    runs-on: ubuntu-latest
    container:
      image:  clojure:temurin-21-tools-deps
      options: --user 1001 # don't run as root
    services:
      kafka:
        image: confluentinc/cp-kafka:8.3.1
        env:
          # Kafka 4.x runs in KRaft mode - no ZooKeeper.
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
          KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      schema-registry:
        image: confluentinc/cp-schema-registry:8.3.1
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'
      kafka-rest:
        image: confluentinc/cp-kafka-rest:8.3.1
        env:
          KAFKA_REST_BOOTSTRAP_SERVERS: kafka:9092
          KAFKA_REST_LISTENERS: http://0.0.0.0:8082
          KAFKA_REST_SCHEMA_REGISTRY: http://schema-registry:8081
          KAFKA_REST_HOST_NAME: kafka-rest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # do not fetch tags if the trigger event is a tag push
          fetch-tags: ${{ startsWith(github.ref, 'refs/tags') != true }}
          fetch-depth: 100
      - name: build
        run: |
          clojure -M:test
        env:
          KAFKA_BOOTSTRAP_SERVERS: kafka
          SCHEMA_REGISTRY_HOST: schema-registry
          KAFKA_REST_PROXY_HOST: kafka-rest
      - name: lint
        run: clojure -M:clj-kondo --lint src test || true
